name: Release campus-auth packages

on:
  push:
    branches:
      - main
    paths:
      - 'luci-app-campus-auth/**'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (auto = derive from Makefile, create it if missing)
        required: false
        type: string
        default: auto

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          skip=0
          created=0
          version=$(sed -n 's/^PKG_VERSION:=//p' luci-app-campus-auth/Makefile)
          release=$(sed -n 's/^PKG_RELEASE:=//p' luci-app-campus-auth/Makefile)
          if [ -z "${version}" ] || [ -z "${release}" ]; then
            echo "::error::Could not read PKG_VERSION / PKG_RELEASE from luci-app-campus-auth/Makefile"
            exit 1
          fi
          derived="v${version}-r${release}"

          if [ "${INPUT_TAG}" != 'auto' ] && [ -n "${INPUT_TAG}" ]; then
            # An explicit tag was typed in the manual run: it has to exist already.
            tag="${INPUT_TAG}"
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              if git ls-remote --exit-code --tags origin "refs/tags/v${tag}" >/dev/null 2>&1; then
                tag="v${tag}"
              else
                echo "::error::Tag ${tag} does not exist in this repository"
                exit 1
              fi
            fi
            echo "using the tag given in the workflow input: ${tag}"
          else
            # No tag given: derive it from PKG_VERSION / PKG_RELEASE.
            tag="${derived}"
            echo "tag derived from the package version: ${tag}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "${tag} already exists"
              if [ "${EVENT_NAME}" = 'push' ]; then
                echo "::notice::${tag} is already released, nothing to do. Bump PKG_RELEASE to release again."
                skip=1
              fi
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "${tag}" -m "luci-app-campus-auth ${version}-r${release}"
              if git push origin "refs/tags/${tag}"; then
                created=1
                echo "created tag ${tag} at $(git rev-parse HEAD)"
              elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
                echo "${tag} was created by a parallel run in the meantime"
              else
                echo "::error::Could not create tag ${tag}"
                exit 1
              fi
            fi
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "created=${created}" >> "$GITHUB_OUTPUT"

  build:
    name: Build matrix
    needs: prepare
    if: needs.prepare.outputs.skip != '1'
    strategy:
      fail-fast: false
      matrix:
        release:
          - '24.10.5'
          - SNAPSHOT
        arch:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - mipsel_24kc
          - mips_24kc
    uses: ./.github/workflows/build-ipk.yml
    with:
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      artifact-name: luci-app-campus-auth-${{ matrix.arch }}-${{ matrix.release }}
      ref: ${{ needs.prepare.outputs.tag }}

  release:
    name: Publish release
    needs: [ prepare, build ]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download every built package
        uses: actions/download-artifact@v4
        with:
          pattern: luci-app-campus-auth-*
          path: artifacts

      - name: Collect packages and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for artifact in artifacts/*/; do
            # artifact directory is named luci-app-campus-auth-<arch>-<release>
            suffix=${artifact#artifacts/}
            suffix=${suffix%/}
            short=${suffix#luci-app-campus-auth-}
            for file in "$artifact"*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              case "$name" in
                *.ipk|*.apk) ;;
                *) continue ;;
              esac
              cp -v "$file" "dist/luci-app-campus-auth_${short}.${name##*.}"
            done
          done
          count=$(find dist -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) | wc -l)
          echo "collected $count packages"
          if [ "$count" -lt 1 ]; then
            echo "::error::No packages were collected from the build matrix"
            exit 1
          fi
          (cd dist && sha256sum ./*.ipk ./*.apk > SHA256SUMS 2>/dev/null || true)
          ls -l dist

      - name: Write release notes
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^PKG_VERSION:=//p' luci-app-campus-auth/Makefile)
          release=$(sed -n 's/^PKG_RELEASE:=//p' luci-app-campus-auth/Makefile)
          cat > NOTES.md <<EOF
          LuCI 校园网认证插件 ${version}-r${release}（${TAG}）

          ## 安装包命名

          文件名格式为 luci-app-campus-auth_架构-分支.后缀，例如：

          - luci-app-campus-auth_x86_64-24.10.5.ipk：适用于 OpenWrt 24.10.x、ImmortalWrt 24.10 等使用 opkg 的固件
          - luci-app-campus-auth_x86_64-SNAPSHOT.apk：适用于用 apk 管理软件包的新版 OpenWrt / ImmortalWrt

          先确认设备架构，再下载对应文件：

              opkg print-architecture 2>/dev/null || cat /etc/apk/arch 2>/dev/null

          ## 安装

          IPK 固件：

              opkg install /tmp/luci-app-campus-auth_x86_64-24.10.5.ipk

          APK 固件：

              apk add --allow-untrusted /tmp/luci-app-campus-auth_x86_64-SNAPSHOT.apk

          如果 opkg 仍然提示签名问题，请先阅读 README 的“签名说明”一节。

          ## 校验

              sha256sum -c SHA256SUMS
          EOF
          cat NOTES.md

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, replacing matching assets"
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file NOTES.md
          fi
          existing=$(gh release view "${TAG}" --json assets --jq '.assets[].name' || true)
          for file in dist/*; do
            name=$(basename "$file")
            if printf '%s\n' "$existing" | grep -Fxq "${name}"; then
              gh release delete-asset "${TAG}" "${name}" --yes
            fi
          done
          gh release upload "${TAG}" dist/* --clobber